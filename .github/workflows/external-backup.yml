name: external-hourly-backup

on:
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backup:
    name: Export DB and write to adm2saat (prune >10 days)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch export and write to target repo
        uses: actions/github-script@v7
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKUP_URL: ${{ secrets.BACKUP_URL }} # https://www.grbt8.store/api/database-backup/export
          TARGET_REPO: ${{ secrets.TARGET_REPO }} # grbt8yedek/adm2saat
          RETENTION_DAYS: '10'
        with:
          github-token: ${{ secrets.TARGET_TOKEN }}
          script: |
            const fetchExport = async () => {
              const url = process.env.BACKUP_URL;
              const secret = process.env.CRON_SECRET;
              if (!url || !secret) {
                core.setFailed('BACKUP_URL veya CRON_SECRET eksik');
                return null;
              }
              const res = await fetch(url, { headers: { Authorization: `Bearer ${secret}` } });
              if (!res.ok) {
                core.setFailed(`Export endpoint error: ${res.status}`);
                return null;
              }
              return await res.json();
            };

            const data = await fetchExport();
            if (!data || !data.success) {
              core.setFailed('Export başarısız');
              return;
            }

            const target = process.env.TARGET_REPO;
            const [owner, repo] = (target || '').split('/');
            if (!owner || !repo) {
              core.setFailed('TARGET_REPO beklenen formatta değil (owner/repo)');
              return;
            }

            const fileName = data.fileName || `admin_backup_${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
            const contentObj = data.data;
            const filePath = `backups/${fileName}`;
            const encoded = Buffer.from(JSON.stringify(contentObj, null, 2)).toString('base64');

            // Mevcutsa SHA al
            let sha = undefined;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: filePath });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {}

            // Yaz
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: filePath,
              message: `Admin export backup - ${new Date().toLocaleString('tr-TR')}`,
              content: encoded,
              sha,
            });

            // Prune > N days
            const retentionDays = parseInt(process.env.RETENTION_DAYS || '10', 10);
            const cutoff = new Date(Date.now() - retentionDays*24*60*60*1000);
            try {
              const list = await github.rest.repos.getContent({ owner, repo, path: 'backups' });
              const files = Array.isArray(list.data) ? list.data : [];
              for (const f of files) {
                if (f.type !== 'file' || !f.name.endsWith('.json')) continue;
                const name = f.name;
                const tsPart = name.replace('admin_backup_','').replace('.json','').replace(/-/g, ':');
                const isoGuess = tsPart.replace(/:(\d{3})Z$/, '.$1Z');
                const dt = new Date(isoGuess);
                if (!isNaN(dt.getTime()) && dt < cutoff) {
                  await github.rest.repos.deleteFile({ owner, repo, path: `backups/${name}`, message: `Prune old backup ${name}`, sha: f.sha });
                }
              }
            } catch (e) {
              core.info('Backups klasörü yok, prune atlandı');
            }

